
name: Build IPA HUB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail

          xcodebuild \
            -project IPAHub.xcodeproj \
            -scheme IPAHub \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee build.log

      - name: Package unsigned IPA
        if: success()
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/IPA HUB.app"

          test -d "$APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          /usr/bin/zip -qry IPA-HUB-unsigned.ipa Payload

          test -s IPA-HUB-unsigned.ipa

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IPA-HUB-unsigned
          path: IPA-HUB-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IPA-HUB-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
